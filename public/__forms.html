<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms — Domaine Sibérania</title>
  </head>
  <body>
    <!-- Formulaire détecté au build Netlify. Les envois JS postent ici. -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="bot-field" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="interest" />
      <input type="text" name="activityKind" />
      <textarea name="message"></textarea>
      <input type="text" name="preferredDate" />
      <input type="text" name="participants" />
      <input type="text" name="level" />
      <input type="text" name="notes" />
      <input type="text" name="animalName" />
      <input type="text" name="animalSpecies" />
      <input type="text" name="sessionMode" />
      <input type="text" name="reason" />
      <input type="text" name="audience" />
      <input type="text" name="format" />
      <input type="text" name="organization" />
      <input type="text" name="objective" />
      <input type="text" name="details" />
    </form>
  </body>
</html>
